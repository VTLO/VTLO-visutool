<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VTLO-visutool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2306080b'/%3E%3Cpath d='M6 8l3 8 3-8M15 6v12' stroke='%2335e8f5' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#06080b;--bg2:#0a0e13;--ink:#cfd9e2;--dim:#66737f;--faint:#2a3744;--line:#161e26;
  --acc:#35e8f5;--acc2:#ff3fd0;--ok:#43e5a0;--err:#ff5c7a;--warn:#ffc857;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000 url(/bg.jpg) center/cover no-repeat fixed;color:var(--ink);font:12px/1.5 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::selection{background:rgba(53,232,245,.25)}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:1px solid var(--acc);outline-offset:2px}

/* header */
body::before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(4,6,9,.66),rgba(4,6,9,.78));pointer-events:none;z-index:0}
header,#main{position:relative;z-index:1}
header{height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:rgba(6,8,11,.55);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;user-select:none}
.brand .bar{color:var(--acc)}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:background .3s,box-shadow .3s}
body.running .brand .dot{background:var(--acc);box-shadow:0 0 12px var(--acc);animation:pulse 1.1s ease-in-out infinite}
.pname{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.pname b{color:var(--ink);font-weight:600}
.sp{flex:1}
#status{color:var(--dim);white-space:nowrap}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;color:var(--dim);transition:.15s}
.ibtn:hover{border-color:var(--acc);color:var(--ink)}
.ibtn[aria-pressed=true]{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:rgba(53,232,245,.07)}
.ibtn.warn[aria-pressed=true]{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:rgba(255,200,87,.07)}
.ibtn.go{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.ibtn.go:hover{background:rgba(53,232,245,.1)}
.ibtn.stop{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.ibtn[hidden]{display:none}
select{background:var(--bg);border:1px solid var(--line);border-radius:9px;height:32px;padding:0 8px;color:var(--ink);cursor:pointer}
select:hover{border-color:var(--acc)}
.hostwrap{position:relative;display:flex;align-items:center}
.hostwrap i{position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}
.hostwrap.missing i{display:block}

/* layout */
#main{display:flex;height:calc(100% - 46px);position:relative}
#pal{width:276px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(6,8,11,.62);backdrop-filter:blur(8px);transition:margin-left .22s ease}
body.nopal #pal{margin-left:-276px}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;min-height:120px}
#stage.drag{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#nodes{position:absolute;inset:0;pointer-events:none}
#hint{position:absolute;left:14px;right:14px;bottom:10px;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#hint b{color:var(--acc);font-weight:500}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);pointer-events:none}
#empty svg.ic{width:30px;height:30px;color:var(--acc);margin-bottom:10px;opacity:.8}
#empty p{margin:2px 0}
#empty[hidden]{display:none}
#plan{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.72);backdrop-filter:blur(4px);padding:12px}
#plan.on{display:flex}
#plan .box{width:min(560px,100%);max-height:100%;overflow:auto;border:1px solid var(--faint);border-radius:14px;background:rgba(10,14,19,.97);padding:16px;display:flex;flex-direction:column;gap:10px}
#plan h2{margin:0;font-size:14px;letter-spacing:.04em}
#plan .sub{font-size:11px;opacity:.7}
#plan .lay{display:flex;flex-direction:column;gap:4px;border-left:2px solid var(--faint);padding-left:10px}
#plan .lay.par{border-left-color:var(--accent,#5eead4)}
#plan label.st{display:flex;gap:8px;align-items:baseline;font-size:12px;cursor:pointer}
#plan label.st small{opacity:.6;font-size:10.5px}
#plan .unres{font-size:11px;color:var(--err)}
#plan .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
#plan .act button,#plan select{font:inherit;font-size:12px;padding:7px 12px;border-radius:9px;border:1px solid var(--faint);background:rgba(255,255,255,.04);color:inherit;cursor:pointer}
#plan .act button.ok{border-color:var(--accent,#5eead4)}
#toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);padding:7px 12px;border:1px solid var(--faint);border-radius:9px;background:rgba(10,14,19,.96);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:80%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--err);color:var(--err)}

/* nodes */
.node{--tc:var(--dim);position:absolute;left:0;top:0;width:176px;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px 0 9px;border:1px solid var(--faint);border-radius:13px;background:rgba(9,13,18,.9);pointer-events:auto;cursor:pointer;user-select:none;will-change:transform;transition:border-color .2s,box-shadow .35s,background .3s}
.node[data-type=skill]{--tc:#35e8f5}.node[data-type=command]{--tc:#ff3fd0}.node[data-type=script]{--tc:#43e5a0}.node[data-type=prompt]{--tc:#ffc857}.node[data-type=ref]{--tc:#8fa5b7}
.node:hover{border-color:var(--tc)}
.node .w{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--tc) 38%,transparent);color:var(--tc);flex:none;background:color-mix(in srgb,var(--tc) 7%,transparent)}
.node .t{min-width:0;flex:1}
.node b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node i{display:block;font-style:normal;color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .st{width:16px;height:16px;color:var(--dim);flex:none;display:grid;place-items:center}
.node .st svg{display:none}
.node .bar{position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;overflow:hidden;display:none}
.node .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:slide 1.2s linear infinite}
.node .info{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--bg2);border:1px solid var(--faint);display:grid;place-items:center;color:var(--dim);opacity:0;transition:.15s}
.node:hover .info,.node:focus-within .info{opacity:1}
.node .info:hover{color:var(--acc);border-color:var(--acc)}
.node .info svg{width:11px;height:11px}
.node.sel{box-shadow:0 0 0 1px var(--tc)}
.node.queued{border-style:dashed}.node.queued .st .i-q{display:block}
.node.running{border-color:var(--acc);box-shadow:0 0 0 1px rgba(53,232,245,.35),0 0 26px -6px var(--acc)}
.node.running .bar{display:block}.node.running .st .i-run{display:block;color:var(--acc);animation:spin .9s linear infinite}
.node.running .w svg{animation:pulse 1s ease-in-out infinite}
.node.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--faint))}.node.done .st .i-ok{display:block;color:var(--ok)}
.node.error{border-color:var(--err)}.node.error .st .i-err{display:block;color:var(--err)}
.node.skipped{opacity:.4}.node.skipped .st .i-skip{display:block}
.node.stopped .st .i-stop{display:block;color:var(--warn)}

/* palette */
.ph{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.ph .f{position:relative;flex:1}
.ph .f svg{position:absolute;left:9px;top:9px;width:14px;height:14px;color:var(--dim)}
.ph input{width:100%;height:32px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:0 10px 0 29px;outline:0}
.ph input:focus{border-color:var(--acc)}
#plist{flex:1;overflow:auto;padding:4px 0 8px}
.gh{display:flex;align-items:center;gap:6px;padding:10px 12px 4px;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;user-select:none}
.gh em{font-style:normal;color:var(--faint)}
.gh:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:9px;padding:5px 12px;cursor:pointer;border-left:2px solid transparent}
.row:hover{background:rgba(255,255,255,.025)}
.row .ri{color:var(--dim)}
.row[data-t=skill] .ri{color:#35e8f5}.row[data-t=command] .ri{color:#ff3fd0}.row[data-t=script] .ri{color:#43e5a0}.row[data-t=prompt] .ri{color:#ffc857}.row[data-t=ref] .ri{color:#8fa5b7}.row[data-t=pipeline] .ri{color:var(--ink)}
.row .rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--dim);font-size:10px}
.row.on{border-left-color:var(--acc);background:rgba(53,232,245,.06)}
.row.cur .rn{color:var(--acc)}
.more{padding:4px 12px;color:var(--dim);font-size:11px}
#pf{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
#pf input{height:30px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:0 10px;outline:0;width:100%}
#pf input:focus{border-color:var(--acc)}
#pf .r{display:flex;align-items:center;gap:6px}
#pf .r span{flex:1;min-width:0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pf select{height:32px;width:84px;flex:none}
#pf .ibtn{flex:none}

/* drawer */
#drawer{height:240px;border-top:1px solid var(--line);background:rgba(8,12,17,.78);backdrop-filter:blur(8px);display:flex;flex-direction:column;transition:height .2s}
#drawer.min{height:34px}
.dbar{height:34px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line)}
#drawer.min .dbar{border-bottom-color:transparent}
.tab{padding:5px 10px;border-radius:7px;color:var(--dim)}
.tab[aria-selected=true]{color:var(--ink);background:rgba(255,255,255,.05)}
.chip{padding:3px 8px;border:1px solid var(--line);border-radius:7px;color:var(--dim);font-size:11px}
.chip[aria-pressed=true]{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.mini{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--dim)}
.mini:hover{color:var(--ink);background:rgba(255,255,255,.05)}
#log,#detail{flex:1;overflow:auto;padding:8px 14px 12px;min-height:0}
#drawer.min #log,#drawer.min #detail{display:none}
#log .ln{white-space:pre-wrap;word-break:break-word;color:#aebbc7}
#log .ln .n{display:inline-block;min-width:96px;max-width:96px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;white-space:nowrap;margin-right:10px}
#log .ln.err .x{color:var(--err)}#log .ln.sys .x{color:var(--acc)}
#log .ln.dim{opacity:.35}
#log .none{color:var(--dim)}
#detail label{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin:10px 0 4px}
#detail textarea,#detail input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:0;resize:vertical}
#detail textarea{min-height:64px}
#detail textarea:focus,#detail input:focus{border-color:var(--acc)}
#detail .dh{display:flex;align-items:center;gap:8px}
#detail .dh small{color:var(--dim)}
#detail .checks{display:flex;flex-wrap:wrap;gap:6px}
#detail .checks label{margin:0;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer}
#detail .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--acc)}
.btn.p{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.btn.d:hover{border-color:var(--err);color:var(--err)}
#detail pre{white-space:pre-wrap;word-break:break-word;color:#aebbc7;margin:6px 0 0;max-height:150px;overflow:auto}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes slide{from{background-position:-60% 0}to{background-position:160% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
  #pal{position:absolute;z-index:30;top:0;bottom:0;background:var(--bg2);width:min(86vw,300px);box-shadow:10px 0 40px rgba(0,0,0,.6)}
  body.nopal #pal{margin-left:calc(-1 * min(86vw,300px) - 40px)}
  .pname{display:none}#status{display:none}
  #drawer{height:200px}
}
#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#0b1118,#04060a);perspective:900px;overflow:hidden;transition:opacity .7s ease,filter .7s ease}
#splash.out{opacity:0;filter:blur(12px);pointer-events:none}
#splash .pz{position:relative;width:min(56vmin,360px);aspect-ratio:795/708;transform-style:preserve-3d;animation:pzspin 4.2s ease-in-out forwards}
#splash .pc{position:absolute;background-image:url(/splash.png);background-repeat:no-repeat;opacity:0;transform-style:preserve-3d;animation:pzin 1.5s cubic-bezier(.2,.8,.2,1) forwards;will-change:transform,filter,opacity}
#splash .glow{position:absolute;inset:-20%;background:url(/splash.png) center/contain no-repeat;filter:blur(38px) saturate(1.6);opacity:0;animation:pzglow 3.4s ease forwards}
@keyframes pzin{0%{opacity:0;filter:blur(18px);transform:translate3d(var(--x),var(--y),var(--z)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(.6)}
 55%{opacity:1;filter:blur(7px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes pzspin{0%{transform:rotateY(-24deg) rotateX(10deg)}60%{transform:rotateY(10deg) rotateX(-4deg)}100%{transform:rotateY(0) rotateX(0)}}
@keyframes pzglow{0%{opacity:0}60%{opacity:.55}100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#splash .pc,#splash .pz,#splash .glow{animation-duration:.01s;animation-delay:0s!important}}

.tbtn{height:32px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:12px;white-space:nowrap;transition:.15s}
.tbtn:hover:not(:disabled){border-color:var(--acc)}
.tbtn.go{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.tbtn.go:hover:not(:disabled){background:rgba(53,232,245,.1)}
.tbtn.stop{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.tbtn.warn[aria-pressed=true]{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:rgba(255,200,87,.07)}
.tbtn.big{height:38px;font-size:13px;font-weight:600;background:rgba(53,232,245,.1)}
.tbtn:disabled{opacity:.38;cursor:not-allowed}
.tbtn[hidden]{display:none}
.tbtn .ic{width:15px;height:15px}
.hl{color:var(--dim);font-size:11px;white-space:nowrap}
#pf .pfh{font-size:11px;color:var(--dim)}
#pf .r2{display:flex;gap:6px}#pf .r2 .tbtn{flex:1}
#pf select{width:auto;flex:1;min-width:0}
#pf .r label{color:var(--dim);font-size:11px;flex:none}
#pf .r span{flex:none}
.gd{padding:0 12px 4px;font-size:10.5px;color:var(--dim);opacity:.8;line-height:1.35}
.row .ck{flex:none;width:14px;height:14px;border:1px solid var(--faint);border-radius:4px;margin-right:6px;display:grid;place-items:center;color:transparent}
.row .ck svg{width:11px;height:11px}
.row.on .ck{background:var(--acc);border-color:var(--acc);color:#04070a}
.phint{margin:8px 10px 2px;padding:8px 10px;border:1px dashed var(--faint);border-radius:9px;font-size:11.5px;color:var(--dim);line-height:1.45}
#empty .eb{max-width:420px;padding:0 16px}
#empty h3{margin:0 0 8px;font-size:16px;color:var(--ink);font-weight:600}
#empty ol{text-align:left;margin:8px auto 14px;padding-left:20px;font-size:12.5px;line-height:1.7;color:var(--ink)}
#empty .eb .tbtn{pointer-events:auto;margin:0 3px}
#guide{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.78);backdrop-filter:blur(5px);padding:14px}
#guide.on{display:flex}
#guide .box{width:min(820px,100%);max-height:100%;overflow:auto;border:1px solid var(--faint);border-radius:16px;background:rgba(10,14,19,.98);padding:20px;display:flex;flex-direction:column;gap:14px}
#guide h2{margin:0;font-size:17px}#guide .lead{margin:0;color:var(--dim);font-size:12.5px;line-height:1.5}
#guide .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:760px){#guide .steps{grid-template-columns:1fr}}
#guide .st{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.025)}
#guide .st b{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
#guide .st b i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#04070a;font-size:12px}
#guide .st p{margin:0;font-size:12px;line-height:1.5;color:var(--dim)}
#guide .words{font-size:11.5px;line-height:1.6;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}
#guide .words b{color:var(--ink)}
#guide .act{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#guide .act label{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center;cursor:pointer}
@media(max-width:760px){.hl,.tbtn .tx.hm{display:none}}

#brief{margin:10px;padding:11px;border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);border-radius:12px;background:rgba(255,200,87,.06);display:flex;flex-direction:column;gap:6px}
#brief .bh{display:flex;align-items:center;gap:8px;font-size:12.5px}
#brief .bn{width:20px;height:20px;border-radius:50%;background:var(--warn);color:#04070a;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
#brief .bh em{font-style:normal;margin-left:auto;font-size:9.5px;letter-spacing:.08em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);border-radius:10px;padding:2px 7px;white-space:nowrap}
#brief label{font-size:11px;color:var(--ink);line-height:1.35}
#brief textarea,#rb textarea{width:100%;min-height:62px;resize:vertical;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;color:var(--ink);font:inherit;font-size:12px;outline:0}
#brief textarea:focus,#rb textarea:focus{border-color:var(--acc)}
#brief .sum{font-size:11px;line-height:1.5;color:var(--dim)}#brief .sum b{color:var(--ink)}
#brief.done{border-color:color-mix(in srgb,var(--ok,#5be28a) 55%,transparent);background:rgba(91,226,138,.05)}
#brief.done .bn{background:var(--ok,#5be28a)}#brief.done .bh em{color:var(--ok,#5be28a);border-color:color-mix(in srgb,var(--ok,#5be28a) 55%,transparent)}
#brief .form{display:flex;flex-direction:column;gap:6px}
#brief .bh{flex-wrap:wrap;row-gap:4px}#brief .tbtn{white-space:normal;height:auto;min-height:34px;padding:7px 10px;line-height:1.25;text-align:center}
#brief.done:not(.edit) .form{display:none}

<script>
(() => { // launch splash: the badge assembles itself as a blurred 3D puzzle, then clears
  const sp = document.getElementById('splash'), pz = document.getElementById('pz'); if (!sp) return;
  const C = 6, R = 6, r = (a) => (Math.random() * 2 - 1) * a;
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
    const d = document.createElement('div'); d.className = 'pc';
    d.style.cssText = `left:${i * 100 / C}%;top:${j * 100 / R}%;width:${100 / C + .3}%;height:${100 / R + .3}%;background-size:${C * 100}% ${R * 100}%;background-position:${i * 100 / (C - 1)}% ${j * 100 / (R - 1)}%;` +
      `--x:${r(520)}px;--y:${r(420)}px;--z:${r(700) - 200}px;--rx:${r(160)}deg;--ry:${r(160)}deg;--rz:${r(200)}deg;animation-delay:${Math.random() * .9}s`;
    pz.append(d);
  }
  const end = () => { sp.classList.add('out'); setTimeout(() => sp.remove(), 800); };
  const t0 = Date.now(); window.__splashDone = () => setTimeout(end, Math.max(0, 2700 - (Date.now() - t0)));
  setTimeout(end, 6000); sp.onclick = end;
})();
</script>

  const depth = (id) => { if (lay.has(id)) return lay.get(id); lay.set(id, 0); let d = 0; for (const q of by.get(id).needs || []) if (by.has(q)) d = Math.max(d, depth(q) + 1); lay.set(id, d); return d; };
  list.forEach((n) => depth(n.id));
  const L = Math.max(...lay.values()) + 1;
  const cols = Array.from({ length: L }, () => []);
  list.forEach((n) => cols[lay.get(n.id)].push(n));
  const yOf = new Map();
  cols.forEach((col, ci) => {
    if (ci > 0) { const bary = (n) => { const ys = (n.needs || []).filter((d) => yOf.has(d)).map((d) => yOf.get(d)); return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : 0; }; col.sort((a, b) => bary(a) - bary(b)); }
    col.forEach((n, ri) => { const y = (ri - (col.length - 1) / 2) * DY; yOf.set(n.id, y); pos.set(n.id, { x: (ci - (L - 1) / 2) * DX, y, z: Math.round(Math.sin(ci * 1.7 + ri * 2.3) * 70), ci, ri }); });
  });
  const ps = [...pos.values()];
  bbox = { minX: Math.min(...ps.map((p) => p.x)), maxX: Math.max(...ps.map((p) => p.x)), minY: Math.min(...ps.map((p) => p.y)), maxY: Math.max(...ps.map((p) => p.y)) };
  computeFit();
}
function computeFit() {
  if (!W) return;
  const bw = bbox.maxX - bbox.minX + NW + 90, bh = bbox.maxY - bbox.minY + NH + 150;
  fit = Math.max(.5, Math.min(1.2, Math.min(W / bw, H / bh) * .88));
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = stage.clientWidth; H = stage.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  computeFit();
}
new ResizeObserver(resize).observe(stage);

function P(x, y, z) {
  x -= (bbox.minX + bbox.maxX) / 2; y -= (bbox.minY + bbox.maxY) / 2;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
  const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  const s = F / Math.max(120, F + z2), k = fit * cam.zoom * s;
  return { x: W / 2 + cam.px + x1 * k, y: H / 2 + cam.py - 12 + y2 * k, s: k, z: z2 };
}

/* node DOM */
function renderNodes() {
  const list = nodes(); const seen = new Set();
  for (const n of list) {
    seen.add(n.id);
    let el = els.get(n.id);
    if (!el) {
      el = document.createElement('div'); el.className = 'node'; el.dataset.id = n.id; el.tabIndex = 0; el.setAttribute('role', 'button');
      el.innerHTML = `<span class="w"></span><span class="t"><b></b><i></i></span><span class="st">${ic('dots', 'i-q')}${ic('load', 'i-run')}${ic('check', 'i-ok')}${ic('x', 'i-err')}${ic('minus', 'i-skip')}${ic('stop', 'i-stop')}</span><span class="bar"></span><button class="info" title="${t('tipInfo')}" tabindex="-1">${ic('info')}</button>`;
      layer.appendChild(el); els.set(n.id, el);
      el.addEventListener('click', (e) => { if (e.target.closest('.info')) { e.stopPropagation(); selectNode(n.id, true); return; } guard(runNode)(n.id, e.shiftKey); });
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); guard(runNode)(n.id, e.shiftKey); } else if (e.key === 'i') selectNode(n.id, true); });
      el.addEventListener('mouseenter', () => hint(el.dataset.id)); el.addEventListener('mouseleave', () => hint(null)); el.addEventListener('focus', () => hint(el.dataset.id));
    }
    const cur = byId(n.id);
    el.dataset.type = n.type;
    el.querySelector('.w').innerHTML = ic(TYPE_ICON[n.type]);
    el.querySelector('b').textContent = n.label;
    el.querySelector('i').textContent = `${t('ty_' + n.type)}${n.type === 'skill' || n.type === 'command' || n.type === 'prompt' ? ' · ' + S.host : ''}`;
    el.setAttribute('aria-label', `${t('ty_' + n.type)} ${n.label} — ${t('clickRun')}`); el.title = n.label + (n.desc ? ' — ' + n.desc : '');
    el.className = `node ${status(n.id)}${S.sel === n.id ? ' sel' : ''}`;
    void cur;
  }
  for (const [id, el] of els) if (!seen.has(id)) { el.remove(); els.delete(id); }
}
function paintStates() { for (const [id, el] of els) el.className = `node ${status(id)}${S.sel === id ? ' sel' : ''}`; renderHeader(); }
function hint(id) {
  const n = id && byId(id);
  $('#hint').innerHTML = n ? `${t('hint')} &nbsp;│&nbsp; ${esc(n.preview || n.name)}` : '';
}

/* pointer: orbit / pan / zoom */
let drag = null;
for (const ev of ['pointerdown', 'pointerup', 'pointermove', 'wheel', 'contextmenu']) $('#plan').addEventListener(ev, (e) => e.stopPropagation()); // modal must not orbit/capture the 3D stage
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.node')) return;
  drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 1 || e.button === 2 }; stage.setPointerCapture(e.pointerId); stage.classList.add('drag');
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) { cam.tpx += dx; cam.tpy += dy; }
  else { cam.tYaw = Math.max(-.85, Math.min(.85, cam.tYaw + dx * .005)); cam.tPitch = Math.max(-.05, Math.min(.75, cam.tPitch + dy * .004)); }
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('contextmenu', (e) => e.preventDefault());
stage.addEventListener('wheel', (e) => { e.preventDefault(); cam.tZoom = Math.max(.45, Math.min(2.4, cam.tZoom * Math.exp(-e.deltaY * .0012))); }, { passive: false });
stage.addEventListener('dblclick', (e) => { if (e.target.closest('.node')) return; Object.assign(cam, { tYaw: 0, tPitch: .34, tZoom: 1, tpx: 0, tpy: 0 }); });

/* drawing */
const COL = { acc: '53,232,245', acc2: '255,63,208', ok: '67,229,160', err: '255,92,122', dim: '125,150,170' };
let cur = new Map();
function edgePts(a, b, n = 26) {
  const x0 = a.x + NW / 2 - 4, x1 = b.x - NW / 2 + 4, dx = Math.max(70, (x1 - x0) * .5), out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t, k0 = u * u * u, k1 = 3 * u * u * t, k2 = 3 * u * t * t, k3 = t * t * t;
    out.push(P(k0 * x0 + k1 * (x0 + dx) + k2 * (x1 - dx) + k3 * x1, (k0 + k1) * a.y + (k2 + k3) * b.y, (k0 + k1) * a.z + (k2 + k3) * b.z));
  }
  return out;
}
const at = (pts, u) => { const f = u * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f)), r = f - i; return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * r, y: pts[i].y + (pts[i + 1].y - pts[i].y) * r, s: pts[i].s }; };

function drawGrid(t) {
  const yF = bbox.maxY + NH / 2 + 96, xr = Math.max(560, (bbox.maxX - bbox.minX) / 2 + 360);
  const off = (t * 34 * (.15 + cam.e * 1.7)) % 140;
  ctx.lineWidth = 1;
  for (let z = -420; z <= 980; z += 140) {
    const zz = z + off; if (zz > 980) continue;
    const a = P(-xr, yF, zz), b = P(xr, yF, zz);
    ctx.strokeStyle = `rgba(${COL.acc},${(.075 + .06 * cam.e) * Math.max(0, 1 - Math.abs(zz - 150) / 900)})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let x = -xr; x <= xr; x += 140) {
    const a = P(x, yF, -420), b = P(x, yF, 980);
    ctx.strokeStyle = `rgba(${COL.acc},${(.05 + .04 * cam.e) * Math.max(0, 1 - Math.abs(x) / xr)})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
}
function drawGyro(t) {
  const sp = 1 + cam.e * 3.4, R = Math.max(300, (bbox.maxY - bbox.minY) / 2 + 220);
  const c = { x: (bbox.minX + bbox.maxX) / 2, y: (bbox.minY + bbox.maxY) / 2, z: 540 };
  const base = .06 + .2 * cam.e;
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const rx = t * (.21 + .07 * i) * sp + i * 1.05, ry = t * (.15 - .04 * i) * sp + i * .7, r = R * (1 - .07 * i);
    const col = i === 1 ? COL.acc2 : COL.acc;
    ctx.strokeStyle = `rgba(${col},${base})`; ctx.beginPath();
    for (let k = 0; k <= 72; k++) { const p = ringPt(c, r, rx, ry, k / 72 * TAU); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
    ctx.stroke();
    if (i === 0) for (let k = 0; k < 48; k++) { const p = ringPt(c, r, rx, ry, k / 48 * TAU); ctx.fillStyle = `rgba(${col},${base * 1.6})`; ctx.fillRect(p.x - .6, p.y - .6, 1.2, 1.2); }
    const sat = ringPt(c, r, rx, ry, t * (.7 + .3 * i) * sp);
    ctx.fillStyle = `rgba(${col},${.25 + .6 * cam.e})`; ctx.beginPath(); ctx.arc(sat.x, sat.y, (2 + 1.5 * cam.e) * sat.s, 0, TAU); ctx.fill();
  }
}
function ringPt(c, R, rx, ry, th) {
  let x = R * Math.cos(th), y = R * Math.sin(th), z = 0;
  let y1 = y * Math.cos(rx), z1 = y * Math.sin(rx); y = y1; z = z1;
  const x1 = x * Math.cos(ry) + z * Math.sin(ry); z1 = -x * Math.sin(ry) + z * Math.cos(ry);
  return P(c.x + x1, c.y + y, c.z + z1);
}
function drawRing(c, R, rx, ry, t, speed, col) {
  ctx.strokeStyle = `rgba(${col},.55)`; ctx.lineWidth = 1.1; ctx.beginPath();
  for (let i = 0; i <= 56; i++) { const p = ringPt(c, R, rx, ry, i / 56 * TAU); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
  ctx.stroke();
  for (let k = 0; k < 2; k++) {
    const p = ringPt(c, R, rx, ry, t * speed + k * Math.PI);
    ctx.fillStyle = `rgba(${col},.18)`; ctx.beginPath(); ctx.arc(p.x, p.y, 7 * p.s, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(${col},1)`; ctx.beginPath(); ctx.arc(p.x, p.y, 2.4 * p.s, 0, TAU); ctx.fill();
  }
}
function drawEdges(t) {
  ctx.lineCap = 'round';
  for (const n of nodes()) {
    for (const d of n.needs || []) {
      const A = cur.get(d), B = cur.get(n.id); if (!A || !B) continue;
      const sa = status(d), sb = status(n.id), pts = edgePts(A, B), avg = (pts[0].s + pts[pts.length - 1].s) / 2;
      let col = COL.dim, al = .34, dash = [2, 6], mode = 'idle';
      if (sb === 'running') { col = COL.acc; al = .85; dash = []; mode = 'flow'; }
      else if (sb === 'error' || sb === 'skipped') { col = COL.err; al = .35; dash = [3, 5]; }
      else if (sa === 'done' && sb === 'done') { col = COL.ok; al = .5; dash = []; }
      else if (sa === 'running') { col = COL.acc2; al = .45; dash = [4, 6]; mode = 'charge'; }
      else if (sb === 'queued') { col = COL.acc; al = .35; dash = [4, 5]; }
      ctx.setLineDash(dash);
      if (mode === 'flow') { ctx.strokeStyle = `rgba(${col},.12)`; ctx.lineWidth = 6 * avg; path(pts); }
      ctx.strokeStyle = `rgba(${col},${al})`; ctx.lineWidth = Math.max(.8, 1.2 * avg); path(pts);
      ctx.setLineDash([]);
      if (!RM && (mode === 'flow' || mode === 'charge')) {
        const cnt = mode === 'flow' ? 3 : 1, spd = mode === 'flow' ? .55 : .25;
        for (let k = 0; k < cnt; k++) {
          const u = (t * spd + k / cnt + (d.length % 7) * .13) % 1;
          for (let j = 0; j < 6; j++) {
            const uu = u - j * .014; if (uu < 0) continue;
            const p = at(pts, uu);
            ctx.fillStyle = `rgba(${col},${(1 - j / 6) * (mode === 'flow' ? .95 : .6)})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.6, (2.6 - j * .3)) * p.s, 0, TAU); ctx.fill();
          }
        }
      }
    }
  }
}
function path(pts) { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke(); }

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (!W) { resize(); return; }
  const t = RM ? 0 : now / 1000; const dt = Math.min(.05, (now - last) / 1000); last = now;
  const busy = isBusy();
  cam.e += ((busy ? 1 : 0) - cam.e) * Math.min(1, dt * 3);
  const swayY = RM ? 0 : Math.sin(t * .27) * (.05 + .09 * cam.e), swayP = RM ? 0 : Math.sin(t * .19 + 1) * (.02 + .03 * cam.e);
  const k = Math.min(1, dt * 7);
  cam.yaw += (cam.tYaw + swayY - cam.yaw) * k; cam.pitch += (cam.tPitch + swayP - cam.pitch) * k;
  cam.zoom += (cam.tZoom - cam.zoom) * k; cam.px += (cam.tpx - cam.px) * k; cam.py += (cam.tpy - cam.py) * k;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  // world positions with a gentle bob
  cur = new Map();
  for (const [id, p] of pos) cur.set(id, { x: p.x, y: p.y + (RM ? 0 : Math.sin(t * .9 + p.ci * 1.3 + p.ri) * (2.2 + 2 * cam.e)), z: p.z });
  drawGyro(t); drawGrid(t); drawEdges(t);
  for (const n of nodes()) {
    const c = cur.get(n.id), s = status(n.id);
    if (s === 'running' && !RM) { drawRing(c, 104, t * .9, t * .5, t, 2.2, COL.acc); drawRing(c, 94, 1.2 - t * .6, t * .8, t, -1.6, COL.acc2); }
  }
  // DOM nodes
  for (const [id, c] of cur) {
    const el = els.get(id); if (!el) continue;
    const p = P(c.x, c.y, c.z);
    el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) translate(-50%,-50%) scale(${p.s.toFixed(3)})`;
    el.style.opacity = (.5 + .5 * Math.max(0, Math.min(1, (p.s - .55) / .5))).toFixed(2);
    el.style.zIndex = Math.round(p.s * 1000);
  }
}

/* ───────── state sync ───────── */
function applySettings(s) { S.host = s.host; S.hosts = s.hosts || S.hosts; S.autoApprove = s.autoApprove; renderHeader(); renderNodes(); }
function applyPipeline(p) { S.pipeline = p; layout(); renderNodes(); renderHeader(); if (S.tab === 'node') renderDetail(); }
async function resync() {
  const s = await api('state');
  S.items = s.items; S.pipelines = s.pipelines; S.states = s.states || {};
  applySettings(s); applyPipeline(s.pipeline); renderPalette(); S.proposal = s.proposal || null; S.brief = s.brief || null; renderBrief(); renderPalette(); renderPlan();
  if (!s.pipeline) document.body.classList.remove('nopal');
  $('#bPal').setAttribute('aria-pressed', !document.body.classList.contains('nopal'));
  if (!$('#log').childElementCount) (s.logs || []).forEach(pushLog);
  window.__splashDone?.(); window.__guideOnce?.();
}
function connect() {
  const es = new EventSource('/api/events?t=' + encodeURIComponent(TOKEN));
  es.onopen = () => resync().catch((e) => { console.error(e); toast(e.message, true); });
  es.addEventListener('pipeline', (e) => { applyPipeline(JSON.parse(e.data)); api('state').then((s) => { S.states = s.states || {}; S.pipelines = s.pipelines; paintStates(); renderPalette(); }).catch(() => {}); });
  es.addEventListener('brief', (e) => { S.brief = JSON.parse(e.data); renderBrief(); renderPalette(); });
  es.addEventListener('proposal', (e) => { S.proposal = JSON.parse(e.data); renderPlan(); });
  es.addEventListener('settings', (e) => applySettings(JSON.parse(e.data)));
  es.addEventListener('state', (e) => { const s = JSON.parse(e.data); const wasBusy = isBusy(); S.states[s.node] = s; if (!wasBusy && isBusy() && !S.startedAt) S.startedAt = Date.now(); paintStates(); });
  es.addEventListener('log', (e) => pushLog(JSON.parse(e.data)));
  es.addEventListener('run', (e) => {
    const r = JSON.parse(e.data);
    if (r.status === 'start') S.startedAt = Date.now();
    else { S.startedAt = 0; toast(t('finishedIn', r.ok ? t('done') : t('finished_err'), Math.round(r.ms / 1000)), !r.ok); renderHeader(); }
  });
}

/* shortcuts */
addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); document.body.classList.remove('nopal'); $('#bPal').setAttribute('aria-pressed', true); $('#q').focus(); }
  else if (e.key === 'Escape') document.activeElement.blur?.();
});

function applyLang() {
  document.documentElement.lang = LANG; $('#bLang').textContent = LANG.toUpperCase();
  document.querySelectorAll('[data-i]').forEach((e) => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll('[data-h]').forEach((e) => { e.innerHTML = t(e.dataset.h); });
  $('#hostLbl').textContent = t('hostLbl'); $('#planHelp').textContent = t('planHelp');
  const map = [['#hostwrap select', 'hostTip'], ['#bApprove', 'approveTip'], ['#bPal', 'palTip'], ['#bRun', 'runTip'], ['#bStop', 'stopTip'], ['#bRescan', 'rescanTip'], ['#mode', 'modeTip'], ['#bAdd', 'addTip'], ['#bBuild', 'buildTip'], ['#bGo', 'goTip'], ['#fSel', 'onlySelTip'], ['#bClear', 'clearTip'], ['#bMin', 'minTip'], ['#bHelp', 'bHelpT']];
  for (const [s, k] of map) $(s).title = t(k);
  $('#q').placeholder = t('search'); $('#raw').placeholder = t('raw');
  const o = $('#mode').options; o[0].textContent = t('auto'); o[1].textContent = t('seq'); o[2].textContent = t('par');
  $('#tLog').textContent = t('tLog'); $('#tNode').textContent = t('tNode'); $('#fSel').textContent = t('onlySel');
  renderHeader(); renderPalette(); renderBrief(); renderNodes(); if (S.tab === 'node') renderDetail(); if (S.proposal) renderPlan();
}
/* project brief: mandatory before choosing items, re-confirmed at every run launch */
function renderBrief() {
  const b = S.brief, ok = !!b?.confirmed, el = $('#brief');
  el.classList.toggle('done', ok); el.classList.toggle('edit', S.briefEdit);
  $('#pal').classList.toggle('locked', !ok);
  $('#brGoal').placeholder = t('brGoalPh'); $('#brDel').placeholder = t('brDelPh');
  if (b && !S.briefEdit && document.activeElement !== $('#brGoal') && document.activeElement !== $('#brDel')) { $('#brGoal').value = b.goal; $('#brDel').value = b.deliverables; }
  $('#brSum').innerHTML = ok ? `<b>${t('brGoalS')}</b> ${esc(b.goal.length > 120 ? b.goal.slice(0, 120) + '…' : b.goal)}<br><b>${t('brDelS')}</b> ${esc(b.deliverables.length > 120 ? b.deliverables.slice(0, 120) + '…' : b.deliverables)}` : '';
  if (!ok) document.body.classList.remove('nopal');
}
$('#brOk').onclick = guard(async () => {
  const goal = $('#brGoal').value.trim(), deliverables = $('#brDel').value.trim();
  if (!goal || !deliverables) { toast(t('brNeed'), true); return; }
  const r = await api('brief', { goal, deliverables }); S.brief = r.brief; S.briefEdit = false; renderBrief(); renderPalette(); toast(t('brSaved'));
});
$('#brEdit').onclick = () => { S.briefEdit = true; renderBrief(); $('#brGoal').focus(); };
function askBrief() { // resolves with {goal, deliverables} once confirmed for THIS launch, or null
  return new Promise((resolve) => {
    if ($('#rb').classList.contains('on')) return resolve(null);
    S.rbRes = resolve; $('#rbGoal').value = S.brief?.goal || ''; $('#rbDel').value = S.brief?.deliverables || '';
    $('#rbGoal').placeholder = t('brGoalPh'); $('#rbDel').placeholder = t('brDelPh');
    $('#rb').classList.add('on'); ($('#rbGoal').value ? $('#rbOk') : $('#rbGoal')).focus();
  });
}
const closeRb = (v) => { $('#rb').classList.remove('on'); const r = S.rbRes; S.rbRes = null; r?.(v); };
$('#rbOk').onclick = () => { const goal = $('#rbGoal').value.trim(), deliverables = $('#rbDel').value.trim(); if (!goal || !deliverables) { toast(t('brNeed'), true); return; } closeRb({ goal, deliverables }); };
$('#rbNo').onclick = () => closeRb(null);
$('#rb').addEventListener('click', (e) => { if (e.target.id === 'rb') closeRb(null); });
/* beginner guide */
const guideSeen = () => { try { return localStorage.getItem('flow-guide') === '1'; } catch (e) { return false; } };
const openGuide = () => { $('#guide').classList.add('on'); $('#gOk').focus(); };
const closeGuide = () => { $('#guide').classList.remove('on'); try { if ($('#gNever').checked) localStorage.setItem('flow-guide', '1'); else localStorage.removeItem('flow-guide'); } catch (e) { /* ignore */ } };
$('#gOk').onclick = closeGuide; $('#bHelp').onclick = openGuide; $('#eGuide').onclick = openGuide;
$('#eCat').onclick = () => { document.body.classList.remove('nopal'); $('#bPal').setAttribute('aria-pressed', true); setTimeout(resize, 260); };
$('#guide').addEventListener('click', (e) => { if (e.target.id === 'guide') closeGuide(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#rb').classList.contains('on')) closeRb(null); else if ($('#guide').classList.contains('on')) closeGuide(); else if (S.proposal) $('#planNo').click(); } });
window.__guideOnce = () => { if (!guideSeen() && !window.__guided) { window.__guided = 1; setTimeout(openGuide, 3200); } };
$('#bLang').onclick = () => { LANG = LANG === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('flow-lang', LANG); } catch (e) { /* ignore */ } applyLang(); };
setTab('log');
$('#bPal').setAttribute('aria-pressed', false);
applyLang();
resize(); requestAnimationFrame(frame);
connect();
})();
</script>
</body>
